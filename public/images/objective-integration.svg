<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-integration" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2d4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="track-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d2d3d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#55C1F6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#2d2d3d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-integration)"/>

  <!-- Existing rail infrastructure (left side) -->
  <g transform="translate(50, 150)">
    <text x="0" y="-20" font-family="monospace" font-size="14" fill="#888" opacity="0.8">EXISTING RAIL</text>
    <!-- Traditional track -->
    <rect x="0" y="80" width="250" height="6" fill="#4a4a5a"/>
    <rect x="0" y="94" width="250" height="6" fill="#4a4a5a"/>
    <!-- Rail ties -->
    <rect x="10" y="75" width="8" height="30" fill="#2a2a3a"/>
    <rect x="40" y="75" width="8" height="30" fill="#2a2a3a"/>
    <rect x="70" y="75" width="8" height="30" fill="#2a2a3a"/>
    <rect x="100" y="75" width="8" height="30" fill="#2a2a3a"/>
    <rect x="130" y="75" width="8" height="30" fill="#2a2a3a"/>
    <rect x="160" y="75" width="8" height="30" fill="#2a2a3a"/>
    <rect x="190" y="75" width="8" height="30" fill="#2a2a3a"/>
    <rect x="220" y="75" width="8" height="30" fill="#2a2a3a"/>

    <!-- Traditional train -->
    <rect x="20" y="30" width="180" height="40" rx="5" fill="#3a4a5a"/>
    <circle cx="60" cy="75" r="8" fill="#2a2a3a"/>
    <circle cx="160" cy="75" r="8" fill="#2a2a3a"/>
  </g>

  <!-- Transition zone (center) -->
  <g transform="translate(350, 200)">
    <!-- Connection arrows -->
    <path d="M 0 0 L 40 0 L 35 -5 M 40 0 L 35 5" stroke="#55C1F6" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 0 20 L 40 20 L 35 15 M 40 20 L 35 25" stroke="#2B7CEE" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 0 40 L 40 40 L 35 35 M 40 40 L 35 45" stroke="#143DB8" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Integration symbol -->
    <circle cx="20" cy="20" r="30" fill="none" stroke="#55C1F6" stroke-width="2" opacity="0.5"/>
    <circle cx="20" cy="20" r="20" fill="none" stroke="#2B7CEE" stroke-width="2" opacity="0.6"/>
    <circle cx="20" cy="20" r="10" fill="#143DB8" opacity="0.7"/>
  </g>

  <!-- Hybrid maglev infrastructure (right side) -->
  <g transform="translate(500, 150)">
    <text x="0" y="-20" font-family="monospace" font-size="14" fill="#55C1F6" opacity="0.9">HYBRID MAGLEV</text>
    <!-- Enhanced track with magnetic guides -->
    <rect x="0" y="80" width="250" height="6" fill="url(#track-gradient)"/>
    <rect x="0" y="94" width="250" height="6" fill="url(#track-gradient)"/>

    <!-- Magnetic guides (elevated sides) -->
    <rect x="-10" y="60" width="6" height="50" fill="#2B7CEE" opacity="0.6"/>
    <rect x="254" y="60" width="6" height="50" fill="#2B7CEE" opacity="0.6"/>

    <!-- Upgraded rail ties -->
    <rect x="10" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>
    <rect x="40" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>
    <rect x="70" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>
    <rect x="100" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>
    <rect x="130" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>
    <rect x="160" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>
    <rect x="190" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>
    <rect x="220" y="75" width="8" height="30" fill="#143DB8" opacity="0.7"/>

    <!-- Hybrid maglev train (levitating) -->
    <rect x="20" y="15" width="180" height="40" rx="8" fill="#2B7CEE" opacity="0.8"/>
    <rect x="30" y="23" width="35" height="18" rx="3" fill="#55C1F6" opacity="0.5"/>
    <rect x="80" y="23" width="35" height="18" rx="3" fill="#55C1F6" opacity="0.5"/>
    <rect x="130" y="23" width="35" height="18" rx="3" fill="#55C1F6" opacity="0.5"/>

    <!-- Levitation glow -->
    <ellipse cx="110" cy="60" rx="90" ry="6" fill="#55C1F6" opacity="0.5"/>
  </g>

  <!-- Title text -->
  <text x="400" y="400" font-family="monospace" font-size="24" fill="#55C1F6" text-anchor="middle" opacity="0.5">
    SEAMLESS INTEGRATION
  </text>
</svg>
