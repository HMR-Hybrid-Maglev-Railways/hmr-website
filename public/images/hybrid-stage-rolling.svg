<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="480" fill="#0a1628"/>

  <!-- Ground -->
  <rect x="0" y="320" width="800" height="160" fill="#1e293b"/>

  <!-- Railway bed -->
  <rect x="0" y="300" width="800" height="24" fill="#334155"/>

  <!-- Rail -->
  <rect x="0" y="296" width="800" height="6" fill="#64748b"/>

  <!-- Sleepers -->
  <g fill="#1e293b">
    <rect x="80" y="304" width="10" height="16"/>
    <rect x="140" y="304" width="10" height="16"/>
    <rect x="200" y="304" width="10" height="16"/>
    <rect x="260" y="304" width="10" height="16"/>
    <rect x="320" y="304" width="10" height="16"/>
    <rect x="380" y="304" width="10" height="16"/>
    <rect x="440" y="304" width="10" height="16"/>
    <rect x="500" y="304" width="10" height="16"/>
    <rect x="560" y="304" width="10" height="16"/>
    <rect x="620" y="304" width="10" height="16"/>
    <rect x="680" y="304" width="10" height="16"/>
    <rect x="740" y="304" width="10" height="16"/>
  </g>

  <!-- Side magnets (dim) -->
  <g fill="#1e3a5f" opacity="0.4">
    <rect x="120" y="290" width="20" height="6" rx="1"/>
    <rect x="220" y="290" width="20" height="6" rx="1"/>
    <rect x="320" y="290" width="20" height="6" rx="1"/>
    <rect x="420" y="290" width="20" height="6" rx="1"/>
    <rect x="520" y="290" width="20" height="6" rx="1"/>
    <rect x="620" y="290" width="20" height="6" rx="1"/>
    <rect x="720" y="290" width="20" height="6" rx="1"/>
  </g>

  <!-- Under-rail magnets (dim) -->
  <g fill="#1e3a5f" opacity="0.3">
    <rect x="170" y="308" width="24" height="4"/>
    <rect x="320" y="308" width="24" height="4"/>
    <rect x="470" y="308" width="24" height="4"/>
    <rect x="620" y="308" width="24" height="4"/>
  </g>

  <!-- Train (on rails) -->
  <g>
    <!-- Body -->
    <rect x="200" y="220" width="400" height="60" rx="12" fill="#3b82f6"/>

    <!-- Nose -->
    <path d="M600 220 L600 280 L660 265 Q680 255 680 250 Q680 245 660 235 L600 220" fill="#60a5fa"/>

    <!-- Tail -->
    <path d="M200 220 L140 235 Q120 245 120 250 Q120 255 140 265 L200 280" fill="#2563eb"/>

    <!-- Windows -->
    <rect x="230" y="235" width="50" height="24" rx="3" fill="#0c4a6e"/>
    <rect x="300" y="235" width="50" height="24" rx="3" fill="#0c4a6e"/>
    <rect x="370" y="235" width="50" height="24" rx="3" fill="#0c4a6e"/>
    <rect x="440" y="235" width="50" height="24" rx="3" fill="#0c4a6e"/>
    <rect x="510" y="235" width="50" height="24" rx="3" fill="#0c4a6e"/>

    <!-- Stripe -->
    <rect x="120" y="265" width="560" height="3" fill="#60a5fa"/>

    <!-- Headlight -->
    <circle cx="670" cy="250" r="4" fill="#fef3c7"/>

    <!-- Rear light -->
    <circle cx="130" cy="250" r="3" fill="#ef4444"/>
  </g>

  <!-- Wheels (on rails) -->
  <g fill="#1f2937" stroke="#475569" stroke-width="2">
    <circle cx="260" cy="290" r="10"/>
    <circle cx="340" cy="290" r="10"/>
    <circle cx="460" cy="290" r="10"/>
    <circle cx="540" cy="290" r="10"/>
  </g>
</svg>