<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-friction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow-friction" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#55C1F6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#2B7CEE;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#143DB8;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-friction)"/>

  <!-- Electromagnetic field lines -->
  <g opacity="0.3">
    <ellipse cx="400" cy="225" rx="300" ry="80" fill="none" stroke="#55C1F6" stroke-width="2" stroke-dasharray="10,5"/>
    <ellipse cx="400" cy="225" rx="250" ry="60" fill="none" stroke="#2B7CEE" stroke-width="2" stroke-dasharray="10,5"/>
    <ellipse cx="400" cy="225" rx="200" ry="40" fill="none" stroke="#143DB8" stroke-width="2" stroke-dasharray="10,5"/>
  </g>

  <!-- Levitating train silhouette -->
  <g transform="translate(250, 180)">
    <!-- Train body -->
    <rect x="0" y="0" width="300" height="50" rx="10" fill="url(#glow-friction)"/>
    <rect x="10" y="10" width="280" height="30" rx="5" fill="#0a0515" opacity="0.5"/>

    <!-- Windows -->
    <rect x="30" y="18" width="40" height="20" rx="3" fill="#55C1F6" opacity="0.6"/>
    <rect x="90" y="18" width="40" height="20" rx="3" fill="#55C1F6" opacity="0.6"/>
    <rect x="150" y="18" width="40" height="20" rx="3" fill="#55C1F6" opacity="0.6"/>
    <rect x="210" y="18" width="40" height="20" rx="3" fill="#55C1F6" opacity="0.6"/>

    <!-- Glow effect under train -->
    <ellipse cx="150" cy="60" rx="140" ry="8" fill="#55C1F6" opacity="0.4"/>
  </g>

  <!-- Rail track -->
  <g transform="translate(200, 290)">
    <rect x="0" y="0" width="400" height="8" fill="#2d2d3d"/>
    <rect x="0" y="12" width="400" height="8" fill="#2d2d3d"/>
    <!-- Rail ties -->
    <rect x="20" y="-5" width="10" height="30" fill="#1a1a24" opacity="0.6"/>
    <rect x="80" y="-5" width="10" height="30" fill="#1a1a24" opacity="0.6"/>
    <rect x="140" y="-5" width="10" height="30" fill="#1a1a24" opacity="0.6"/>
    <rect x="200" y="-5" width="10" height="30" fill="#1a1a24" opacity="0.6"/>
    <rect x="260" y="-5" width="10" height="30" fill="#1a1a24" opacity="0.6"/>
    <rect x="320" y="-5" width="10" height="30" fill="#1a1a24" opacity="0.6"/>
    <rect x="380" y="-5" width="10" height="30" fill="#1a1a24" opacity="0.6"/>
  </g>

  <!-- Energy/friction particles (stars/sparkles) -->
  <circle cx="250" cy="240" r="3" fill="#55C1F6" opacity="0.8"/>
  <circle cx="550" cy="240" r="3" fill="#55C1F6" opacity="0.8"/>
  <circle cx="300" cy="260" r="2" fill="#2B7CEE" opacity="0.6"/>
  <circle cx="500" cy="260" r="2" fill="#2B7CEE" opacity="0.6"/>

  <!-- Title text -->
  <text x="400" y="400" font-family="monospace" font-size="24" fill="#55C1F6" text-anchor="middle" opacity="0.5">
    ELIMINATE FRICTION
  </text>
</svg>
